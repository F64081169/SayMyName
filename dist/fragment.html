<title>Shannon's World</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: full-screen canvas world, floating HUD pills, bottom dialogue card like a sitcom subtitle bar. */
:root {
  --ink: #1f2d36;          /* slate night, HUD + text */
  --paper: #f4f7f3;        /* mint-tinted paper for cards */
  --paper-2: #e6ede8;
  --marigold: #f2b33d;     /* Hsinchu wind / signboard yellow */
  --tile: #2f8f83;         /* old-apartment tile green */
  --rose: #e46b7b;         /* romance */
  --sky: #6fb7de;
  --muted: #5d6e78;
  --danger: #d4553f;
  --hud-bg: rgba(24, 36, 44, 0.78);
  --hud-fg: #f4f7f3;
  --shadow: 0 6px 24px rgba(12, 20, 26, 0.28);
  --font-ui: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  --font-story: "LXGW WenKai TC", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", serif;
  --r: 14px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1f2d36; color: var(--ink); font-family: var(--font-ui); font-size: 15px; }
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; }
[hidden] { display: none !important; }

#app { position: fixed; inset: 0; overflow: hidden; user-select: none; -webkit-user-select: none; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: #1f2d36; }

/* ---------- HUD ---------- */
#hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding: calc(8px + var(--safe-t)) max(10px, var(--safe-r)) 0 max(10px, var(--safe-l)); pointer-events: none; z-index: 5; }
.hud-left, .hud-right { display: flex; gap: 6px; align-items: flex-start; }
.hud-left { min-width: 0; }
.hud-right { flex: none; }
.hud-left { flex-direction: column; }
.pill { background: var(--hud-bg); color: var(--hud-fg); padding: 6px 11px; border-radius: 999px; font-size: 14px; line-height: 1.25; box-shadow: var(--shadow); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.sub { font-size: 12.5px; opacity: .92; }
#hud-stats { display: flex; gap: 10px; align-items: center; }
#hud-stats .bar { display: inline-block; width: 46px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.2); overflow: hidden; vertical-align: middle; }
#hud-stats .bar i { display: block; height: 100%; background: var(--marigold); }
.round { pointer-events: auto; position: relative; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--hud-bg); color: #fff; font-size: 22px; box-shadow: var(--shadow); }
.badge { position: absolute; top: -3px; right: -3px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--rose); color: #fff; font-size: 12px; line-height: 20px; font-weight: 700; }

#objective { position: absolute; left: max(10px, var(--safe-l)); bottom: calc(18px + var(--safe-b)); max-width: min(330px, calc(100vw - 190px)); background: rgba(244,247,243,.92); color: var(--ink);
  border-radius: 10px; padding: 7px 10px; font-size: 12.5px; line-height: 1.45; box-shadow: var(--shadow); z-index: 4; pointer-events: auto; }
#objective b { color: var(--tile); }
#objective .row { display: flex; gap: 6px; }
#objective .row + .row { margin-top: 2px; }

/* ---------- toasts ---------- */
#toasts { position: absolute; left: 50%; transform: translateX(-50%); top: calc(58px + var(--safe-t)); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 19; pointer-events: none; width: min(92vw, 420px); }
.toast { background: rgba(31,45,54,.92); color: #fff; padding: 8px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.4; box-shadow: var(--shadow); animation: toastIn .25s ease-out; text-align: center; }
.toast.mem { background: rgba(47,143,131,.95); }
.toast.warn { background: rgba(212,85,63,.95); }
.toast.love { background: rgba(228,107,123,.95); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

/* ---------- joystick + act button ---------- */
#stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.35); z-index: 6; pointer-events: none; }
#stick-knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.75); }
#btn-act { position: absolute; right: max(14px, calc(var(--safe-r) + 8px)); bottom: calc(18px + var(--safe-b)); z-index: 6; min-width: 132px; max-width: 62vw; min-height: 60px; padding: 8px 18px; border: 0; border-radius: 30px;
  background: var(--marigold); color: var(--ink); font-weight: 700; font-size: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; justify-content: center; }
#btn-act kbd { font-family: var(--font-ui); font-size: 11px; background: rgba(31,45,54,.15); border-radius: 5px; padding: 1px 6px; }
#btn-act #act-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (hover: none) { #btn-act kbd { display: none; } }
@media (max-width: 480px) { .pill { font-size: 13px; padding: 5px 9px; } #hud-stats { gap: 6px; } #hud-stats .bar { width: 30px; } .hud-day { display: none; } #objective { font-size: 12px; } }
.toast { max-width: 100%; }

/* ---------- overlays ---------- */
.overlay { position: absolute; inset: 0; z-index: 20; background: rgba(15,24,30,.45); display: flex; align-items: flex-end; justify-content: center; padding: 0 max(10px, var(--safe-r)) calc(10px + var(--safe-b)) max(10px, var(--safe-l)); }
.sheet-card { width: min(520px, 100%); max-height: 78vh; overflow-y: auto; background: var(--paper); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
#sheet-title { font-family: var(--font-story); font-size: 18px; font-weight: 700; padding: 2px 4px 10px; }
#sheet-title small { display: block; font-family: var(--font-ui); font-weight: 400; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
#sheet-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.sitem { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; border-radius: 12px; background: #fff; padding: 11px 12px; min-height: 54px; box-shadow: 0 1px 0 rgba(31,45,54,.08); }
.sitem:active { transform: scale(.98); }
.sitem .ic { font-size: 22px; width: 28px; text-align: center; flex: none; }
.sitem .tx { min-width: 0; }
.sitem .tx b { display: block; font-size: 15px; }
.sitem .tx span { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.sitem.hot { background: #fff4dc; box-shadow: inset 0 0 0 2px var(--marigold); }
.sitem[disabled] { opacity: .45; cursor: not-allowed; }
.ghost { background: transparent; border: 0; padding: 10px; color: var(--muted); }
#sheet-close { display: block; margin: 10px auto 0; min-height: 44px; min-width: 120px; }

/* ---------- dialogue ---------- */
#dialog { position: absolute; left: 0; right: 0; bottom: 0; z-index: 22; padding: 0 max(10px, var(--safe-r)) calc(10px + var(--safe-b)) max(10px, var(--safe-l)); display: flex; justify-content: center; background: linear-gradient(to top, rgba(15,24,30,.45), rgba(15,24,30,0)); padding-top: 60px; }
#dlg-box { position: relative; width: min(760px, 100%); background: var(--paper); border-radius: 18px; padding: 14px 16px 14px; box-shadow: var(--shadow); min-height: 112px; }
#dlg-head { display: flex; align-items: center; gap: 8px; margin: -30px 0 6px; }
#dlg-face { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--paper); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; font-weight: 700; box-shadow: var(--shadow); flex: none; }
#dlg-name { background: var(--ink); color: #fff; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; margin-top: 18px; }
#dlg-text { font-family: var(--font-story); font-size: 18px; line-height: 1.65; min-height: 3.2em; white-space: pre-wrap; }
#dlg-text.narr { color: var(--muted); font-style: normal; }
#dlg-text.me { color: #24475a; }
#dlg-next { position: absolute; right: 16px; bottom: 8px; font-size: 12px; color: var(--muted); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
#dlg-choices { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
#dlg-choices button { text-align: left; border: 0; background: #fff; border-radius: 12px; padding: 12px 14px; font-size: 15.5px; line-height: 1.4; min-height: 48px; box-shadow: inset 0 0 0 1.5px var(--paper-2); font-family: var(--font-story); }
#dlg-choices button:hover { box-shadow: inset 0 0 0 2px var(--tile); }
#dlg-choices button small { display: block; font-family: var(--font-ui); color: var(--muted); font-size: 12px; margin-top: 2px; }
#dlg-choices button .k { display: inline-block; min-width: 20px; color: var(--tile); font-weight: 700; font-family: var(--font-ui); }
#dlg-choices button[disabled] { opacity: .45; }
@media (max-height: 520px) { #dlg-text { font-size: 16px; line-height: 1.5; min-height: 2.4em; } #dlg-choices button { padding: 8px 12px; min-height: 40px; } #dialog { padding-top: 30px; } }

/* ---------- phone ---------- */
#phone { align-items: center; }
#phone-body { width: min(430px, 100%); height: min(760px, calc(100% - 20px)); background: var(--paper); border-radius: 26px; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); border: 6px solid #22323b; animation: up .2s ease-out; }
#phone-top { display: flex; align-items: center; justify-content: space-between; padding: 6px 6px; background: #22323b; color: #fff; }
#phone-top .ghost { color: #fff; font-size: 20px; min-width: 44px; min-height: 40px; }
#phone-title { font-weight: 700; }
#phone-main { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
#phone-tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; border-top: 1px solid var(--paper-2); }
#phone-tabs button { border: 0; background: none; padding: 7px 2px 9px; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; position: relative; }
#phone-tabs button i { font-style: normal; font-size: 20px; }
#phone-tabs button.on { color: var(--tile); font-weight: 700; }
#phone-tabs .badge { top: 2px; right: 18%; }
.list { display: flex; flex-direction: column; gap: 8px; }
.row-btn { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: #fff; border-radius: 12px; padding: 10px 12px; text-align: left; min-height: 54px; }
.row-btn .av { width: 38px; height: 38px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
.row-btn .meta { flex: 1; min-width: 0; }
.row-btn .meta b { display: block; }
.row-btn .meta > span { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-btn .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rose); flex: none; }
.chat { display: flex; flex-direction: column; gap: 8px; }
.bub { max-width: 82%; padding: 8px 12px; border-radius: 14px; background: #fff; line-height: 1.5; font-size: 14.5px; white-space: pre-wrap; }
.bub.me { align-self: flex-end; background: #cfe9e3; }
.bub small { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.bub.sys { align-self: center; background: transparent; color: var(--muted); font-size: 12px; text-align: center; }
.replies { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.replies button, .btn { border: 0; border-radius: 12px; background: var(--tile); color: #fff; padding: 10px 14px; min-height: 44px; text-align: left; font-size: 14.5px; }
.btn.alt { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--paper-2); }
.btn.warn { background: var(--danger); }
.btn[disabled] { opacity: .45; }
.card-sec { background: #fff; border-radius: 14px; padding: 12px; }
.card-sec + .card-sec { margin-top: 10px; }
.card-sec h4 { margin: 0 0 6px; font-family: var(--font-story); font-size: 16px; }
.card-sec p { margin: 4px 0; line-height: 1.55; font-size: 14px; }
.card-sec ul { margin: 4px 0; padding-left: 18px; line-height: 1.55; font-size: 13.5px; }
.tag { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--paper-2); margin: 2px 3px 2px 0; }
.tag.good { background: #d6efe9; color: #1d6158; }
.tag.bad { background: #f8dcd6; color: #8a3324; }
.tag.love { background: #fadde2; color: #8d2c3c; }
.muted { color: var(--muted); font-size: 12.5px; }
.h { font-family: var(--font-story); font-size: 17px; font-weight: 700; margin: 4px 0 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.prof { background: #fff; border-radius: 16px; padding: 14px; text-align: center; }
.prof .big { font-size: 46px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 0; border-radius: 999px; padding: 8px 14px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--paper-2); min-height: 40px; }
.chips button.on { background: var(--tile); color: #fff; box-shadow: none; }

/* ---------- mini games ---------- */
#mini { align-items: center; z-index: 24; }
#mini-body { width: min(620px, 100%); max-height: calc(100% - 16px); overflow-y: auto; background: var(--paper); border-radius: 20px; padding: 14px; box-shadow: var(--shadow); }
.mg-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.mg-head h3 { margin: 0; font-family: var(--font-story); font-size: 19px; }
.mg-head .muted { white-space: nowrap; }
.mg-step { font-size: 13.5px; background: #fff4dc; border-radius: 10px; padding: 8px 10px; margin: 6px 0 8px; line-height: 1.5; }
.code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; background: #1f2d36; color: #e8efe9; border-radius: 12px; padding: 6px; overflow-x: auto; }
.code button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: inherit; font: inherit; padding: 7px 8px; border-radius: 8px; white-space: pre; min-height: 34px; }
.code button:hover { background: rgba(255,255,255,.08); }
.code button.bad { background: rgba(212,85,63,.45); }
.code button.ok { background: rgba(47,143,131,.6); }
.code button.gone { opacity: .3; text-decoration: line-through; }
.code .ln { color: #8aa3a0; display: inline-block; width: 22px; }
.fixes { display: flex; flex-direction: column; gap: 6px; }
.mg-foot { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.rhythm-wrap { position: relative; }
#rh-canvas { width: 100%; height: 300px; display: block; border-radius: 14px; background: #1f2d36; touch-action: none; }
.lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.lanes button { min-height: 70px; border: 0; border-radius: 14px; font-size: 22px; color: #fff; font-weight: 700; touch-action: manipulation; }
.timing { position: relative; height: 54px; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: inset 0 0 0 2px var(--paper-2); margin: 12px 0; }
.timing .zone { position: absolute; top: 0; bottom: 0; background: rgba(47,143,131,.35); }
.timing .zone.perfect { background: rgba(242,179,61,.75); }
.timing .needle { position: absolute; top: 4px; bottom: 4px; width: 6px; margin-left: -3px; background: var(--ink); border-radius: 3px; }
.big-btn { width: 100%; min-height: 64px; border: 0; border-radius: 16px; background: var(--marigold); color: var(--ink); font-size: 20px; font-weight: 700; touch-action: manipulation; }

/* ---------- card (episode, recap) ---------- */
#card { align-items: center; z-index: 26; }
#card-body { width: min(560px, 100%); max-height: calc(100% - 20px); overflow-y: auto; background: var(--paper); border-radius: 22px; padding: 22px 20px; box-shadow: var(--shadow); animation: up .25s ease-out; }
.ep-kicker { font-size: 12.5px; letter-spacing: .14em; color: var(--tile); font-weight: 700; }
.ep-title { font-family: var(--font-story); font-size: 28px; line-height: 1.25; margin: 6px 0 10px; text-wrap: balance; }
.ep-lines { display: grid; gap: 6px; margin: 12px 0; }
.ep-lines div { display: flex; gap: 10px; font-size: 14px; line-height: 1.5; }
.ep-lines b { flex: none; width: 34px; height: 22px; border-radius: 6px; background: var(--ink); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.card-actions .btn { flex: 1; text-align: center; min-width: 120px; }

/* ---------- fade (time skip) ---------- */
#fade { position: absolute; inset: 0; background: rgba(15,24,30,.82); z-index: 40; display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--font-story); font-size: 22px; text-align: center; padding: 20px; animation: fadeIn .2s; }
@keyframes fadeIn { from { opacity: 0; } }

/* ---------- title / creation ---------- */
#title { position: absolute; inset: 0; z-index: 50; overflow-y: auto; background: radial-gradient(120% 80% at 50% 0%, #2c4a52 0%, #1f2d36 60%, #172229 100%); color: #f4f7f3;
  padding: calc(24px + var(--safe-t)) max(16px, var(--safe-r)) calc(24px + var(--safe-b)) max(16px, var(--safe-l)); }
.t-wrap { width: min(560px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.t-logo { font-family: var(--font-story); font-size: clamp(40px, 11vw, 64px); line-height: 1; margin: 8vh 0 0; letter-spacing: .01em; }
.t-logo span { color: var(--marigold); }
.t-sub { font-size: 14px; letter-spacing: .1em; opacity: .8; }
.t-tag { font-family: var(--font-story); font-size: 18px; line-height: 1.6; opacity: .95; margin: 6px 0 10px; }
.t-btns { display: flex; flex-direction: column; gap: 10px; }
.t-btns .btn { text-align: center; font-size: 17px; min-height: 54px; border-radius: 16px; }
.t-btns .btn.primary { background: var(--marigold); color: var(--ink); font-weight: 700; }
.t-btns .btn.alt { background: rgba(255,255,255,.1); color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.25); }
.t-note { font-size: 12.5px; opacity: .7; line-height: 1.6; }
.form { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.form label.lab { font-weight: 700; font-size: 14px; display: block; margin-bottom: 6px; }
.form input[type=text] { width: 100%; font-size: 17px; padding: 11px 12px; border-radius: 12px; border: 2px solid var(--paper-2); background: #fff; font-family: inherit; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--paper-2); }
.swatches button.on { box-shadow: 0 0 0 3px var(--tile); }
.opt-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt-cards button { border: 0; border-radius: 14px; background: #fff; padding: 12px; text-align: left; box-shadow: inset 0 0 0 1.5px var(--paper-2); min-height: 64px; }
.opt-cards button b { display: block; font-size: 15px; }
.opt-cards button span { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.opt-cards button.on { box-shadow: inset 0 0 0 2.5px var(--tile); background: #eef8f5; }
#avatar-prev { width: 96px; height: 96px; display: block; margin: 0 auto; }
@media (max-width: 380px) { .opt-cards { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>

<div id="app">
  <canvas id="game" aria-label="遊戲畫面"></canvas>

  <div id="hud" hidden>
    <div class="hud-left">
      <div id="hud-time" class="pill"></div>
      <div id="hud-place" class="pill sub"></div>
    </div>
    <div class="hud-right">
      <div id="hud-stats" class="pill"></div>
      <button id="btn-phone" class="round" aria-label="打開手機">📱<span id="phone-badge" class="badge" hidden>0</span></button>
    </div>
  </div>

  <div id="objective" hidden></div>
  <div id="toasts"></div>
  <div id="stick" hidden><div id="stick-knob"></div></div>
  <button id="btn-act" hidden><span id="act-label">互動</span><kbd>E</kbd></button>

  <div id="sheet" class="overlay" hidden>
    <div class="sheet-card">
      <div id="sheet-title"></div>
      <div id="sheet-items"></div>
      <button id="sheet-close" class="ghost">取消</button>
    </div>
  </div>

  <div id="dialog" hidden>
    <div id="dlg-box">
      <div id="dlg-head"><span id="dlg-face"></span><span id="dlg-name"></span></div>

  const U = SW.U = {};
  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  U.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  U.chance = (p) => Math.random() < p;
  U.shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  U.hm = (s) => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };

  U.fmt = (min) => { min = ((Math.floor(min) % 1440) + 1440) % 1440; return pad(Math.floor(min / 60)) + ':' + pad(min % 60); };
  U.esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  U.hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; };

  const T = SW.T = {};

  T.SHORT = ['一', '二', '三', '四', '五', '六', '日'];

'use strict';
(function (SW) {
  const U = SW.U, UI = SW.UI;
  const MG = SW.MG = {};
  const $ = (id) => document.getElementById(id);
  let keyHandler = null;
  MG.key = (e) => { if (keyHandler) { keyHandler(e); return true; } return false; };
  function open(html) { $('mini-body').innerHTML = html; $('mini').hidden = false; $('mini-body').scrollTop = 0; }
  function close() { $('mini').hidden = true; $('mini-body').innerHTML = ''; keyHandler = null; }
  MG.active = () => !$('mini').hidden;

  // ---------- Firmware debug puzzle ----------
  MG.debug = function (pid, opt) {
    opt = opt || {};
    const P = SW.PUZZLES[pid];
    const st = SW.S;
    return new Promise((resolve) => {
      let step = 0, mistakes = 0, helped = false;
      const partner = opt.partner;
      const steps = [
        { key: 'logs', prompt: '① 找出「第一個」不正常的 log 行。', items: P.logs, ans: P.badLog },
        { key: 'code', prompt: '② 對照程式碼，哪一行最可疑？', items: P.code, ans: P.badCode },
        { key: 'fix', prompt: '③ 選擇修正方式。', items: P.fixes.map((f) => f.t), ans: P.fixes.findIndex((f) => f.ok) },
      ];
      const gone = [new Set(), new Set(), new Set()];
      const wrongPicked = [new Set(), new Set(), new Set()];
      let note = '';
      function render() {
        const s = steps[step];
        MG._cur = { pid, step };
        const isFix = s.key === 'fix';
        const list = s.items.map((t, i) => {
          const cls = gone[step].has(i) ? 'gone' : wrongPicked[step].has(i) ? 'bad' : '';
          return `<button data-i="${i}" class="${cls}" ${gone[step].has(i) || wrongPicked[step].has(i) ? 'disabled' : ''}><span class="ln">${isFix ? String.fromCharCode(65 + i) : i + 1}</span>${U.esc(t)}</button>`;
        }).join('');
        const help = partner && !helped ? `<button class="btn alt" id="mg-help">${partner === 'mira' ? '🔎 請米拉幫忙重現' : '💡 問阿修'}</button>` : '';
        open(`<div class="mg-head"><h3>🐞 ${U.esc(opt.title || P.title)}</h3><span class="muted">失誤 ${mistakes}／5</span></div>
          <div class="muted" style="line-height:1.5">${U.esc(P.desc)}</div>
          <div class="mg-step">${s.prompt}${note ? `<br><b>${U.esc(note)}</b>` : ''}</div>
          <div class="code ${isFix ? 'fixes' : ''}">${list}</div>
          <div class="mg-foot">${help}<button class="btn alt" id="mg-quit">先放棄</button></div>`);
        $('mini-body').querySelectorAll('.code button').forEach((b) => { b.onclick = () => pick(+b.dataset.i); });
        if ($('mg-help')) $('mg-help').onclick = helpMe;
        $('mg-quit').onclick = () => { close(); resolve({ solved: false, mistakes }); };
      }
      function pick(i) {
        const s = steps[step];
        if (i === s.ans) {
          note = '';
          step++;
          if (step >= steps.length) {
            open(`<div class="mg-head"><h3>✅ 修好了！</h3><span class="muted">失誤 ${mistakes} 次</span></div><div class="mg-step">${U.esc(P.explain)}</div><div class="mg-foot"><span></span><button class="btn" id="mg-ok">提交 Patch</button></div>`);
            $('mg-ok').onclick = () => { close(); resolve({ solved: true, mistakes }); };
            keyHandler = (e) => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'e') { close(); resolve({ solved: true, mistakes }); } };
            return;
          }
          render(); return;
        }
        mistakes++; wrongPicked[step].add(i);
        note = U.pick(['不是這行。再看看時間戳記。', '這行看起來正常。', '方向錯了，想想什麼時候開始變奇怪的。', '嗯……不像根因。']);
        if (mistakes >= 5) {
          open(`<div class="mg-head"><h3>❌ 今天先到這裡</h3></div><div class="mg-step">腦袋過熱了。換個時間、或找個夥伴一起看吧。</div><div class="mg-foot"><span></span><button class="btn" id="mg-ok">好</button></div>`);
          $('mg-ok').onclick = () => { close(); resolve({ solved: false, mistakes }); };

        render();
      }
      function helpMe() {
        helped = true;
        const s = steps[step];
        const wrong = s.items.map((_, i) => i).filter((i) => i !== s.ans && !gone[step].has(i) && !wrongPicked[step].has(i));
        if (partner === 'mira') {

          note = '米拉：「我剛剛重現了一次。劃掉的那些都正常。」';

        } else {
          const good = st.rel.hsiu.friend >= 50 && st.rel.hsiu.tension < 35;
          note = good ? `阿修：「看第 ${s.key === 'fix' ? String.fromCharCode(65 + s.ans) : s.ans + 1} 個。我很確定。」` : `阿修：「一定是第 ${s.key === 'fix' ? String.fromCharCode(65 + wrong[0]) : wrong[0] + 1} 個。相信我，絕對是 cache 的問題。」`;
        }
        render();
      }
      keyHandler = (e) => { const n = parseInt(e.key, 10); if (n >= 1 && n <= 9) pick(n - 1); };
      render();
    });
  };

  // ---------- Rhythm (guitar) ----------
  MG.rhythm = function (opt) {
    opt = opt || {};
    const skill = SW.S.p.skill.guitar;
    return new Promise((resolve) => {
      const len = opt.len || 20;
      const colors = ['#e46b7b', '#f2b33d', '#2f8f83'];
      open(`<div class="mg-head"><h3>🎸 ${U.esc(opt.title || '練吉他')}</h3><span class="muted" id="rh-stat">準備…</span></div>
        <div class="rhythm-wrap"><canvas id="rh-canvas"></canvas></div>
        <div class="lanes">${[0, 1, 2].map((i) => `<button data-l="${i}" style="background:${colors[i]}">${['A', 'S', 'D'][i]}</button>`).join('')}</div>
        <div class="mg-foot"><span class="muted">音符碰到底線時點對應按鈕（鍵盤 A／S／D 或 J／K／L）</span><button class="btn alt" id="rh-skip">跳過（自動演奏）</button></div>`);
      const cv = $('rh-canvas'), g = cv.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const W = cv.clientWidth, Hh = cv.clientHeight; cv.width = W * dpr; cv.height = Hh * dpr; g.scale(dpr, dpr);
      const bpm = opt.slow ? 84 : 100 + Math.min(skill, 6) * 4;
      const beat = 60 / bpm;
      const notes = [];
      let t = 1.6;
      while (t < len) {
        const lane = U.ri(0, 2); notes.push({ t, lane, hit: null });
        if (Math.random() < 0.18 + skill * 0.02) { notes.push({ t, lane: (lane + U.ri(1, 2)) % 3, hit: null }); }
        t += beat * (Math.random() < 0.3 ? 0.5 : 1);
      }
      const win = 0.12 + Math.min(skill, 8) * 0.008, perfectW = win * 0.45;
      const speed = Hh * 0.55; // px per second
      const lineY = Hh - 40;
      let start = null, raf = 0, combo = 0, best = 0, done = false, flash = [0, 0, 0], msg = '';
      function hit(lane) {
        if (start === null || done) return;
        const now = (performance.now() - start) / 1000;
        let bestN = null, bd = 1e9;
        for (const n of notes) { if (n.hit !== null || n.lane !== lane) continue; const d = Math.abs(n.t - now); if (d < bd) { bd = d; bestN = n; } }
        flash[lane] = 1;
        if (bestN && bd <= win) { bestN.hit = bd <= perfectW ? 2 : 1; combo++; best = Math.max(best, combo); msg = bd <= perfectW ? 'Perfect!' : 'Good'; }
        else { combo = 0; msg = 'Miss'; }
      }
      function frame() {
        if (done || !$('rh-stat')) return;
        const now = (performance.now() - start) / 1000;
        g.clearRect(0, 0, W, Hh);
        const lw = W / 3;
        for (let i = 0; i < 3; i++) { g.fillStyle = i % 2 ? 'rgba(255,255,255,0.04)' : 'rgba(255,255,255,0.08)'; g.fillRect(i * lw, 0, lw, Hh); if (flash[i] > 0) { g.fillStyle = `rgba(255,255,255,${flash[i] * 0.25})`; g.fillRect(i * lw, 0, lw, Hh); flash[i] -= 0.08; } }
        g.fillStyle = '#f4f7f3'; g.fillRect(0, lineY - 2, W, 4);
        for (const n of notes) {
          if (n.hit === null && now - n.t > win) { n.hit = 0; combo = 0; msg = 'Miss'; }
          if (n.hit) continue;
          const y = lineY - (n.t - now) * speed; if (y < -20 || y > Hh + 20) continue;
          g.fillStyle = colors[n.lane]; g.beginPath(); g.arc(n.lane * lw + lw / 2, y, 16, 0, 7); g.fill();
          g.strokeStyle = '#fff'; g.lineWidth = 3; g.stroke();

        if (combo > 2) { g.font = '600 15px sans-serif'; g.fillText(`${combo} combo`, W / 2, 64); }
        const hitN = notes.filter((n) => n.hit).length;
        $('rh-stat').textContent = `命中 ${hitN}/${notes.length}`;
        if (now > len + 0.8) return finish();
        raf = requestAnimationFrame(frame);
      }
      function finish(auto) {
        if (done) return; done = true; cancelAnimationFrame(raf);
        let score;
        if (auto) score = U.clamp(38 + skill * 6 + U.ri(-6, 6), 20, 92);
        else { const tot = notes.length; const pts = notes.reduce((a, n) => a + (n.hit === 2 ? 1 : n.hit === 1 ? 0.65 : 0), 0); score = Math.round(pts / tot * 100); }
        const grade = score >= 85 ? 'S' : score >= 70 ? 'A' : score >= 50 ? 'B' : 'C';
        keyHandler = (e) => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'e') { close(); resolve({ score, grade }); } };
        open(`<div class="mg-head"><h3>🎸 ${grade}｜${score} 分</h3><span class="muted">最高連擊 ${best}</span></div><div class="mg-step">${score >= 85 ? '整段一氣呵成，手指自己在跳舞。' : score >= 70 ? '很穩！有幾個地方很有感覺。' : score >= 50 ? '有幾段卡卡的，但聽得出旋律。' : '……嗯，至少你很有勇氣。'}</div><div class="mg-foot"><span></span><button class="btn" id="rh-ok">完成</button></div>`);
        $('rh-ok').onclick = () => { close(); resolve({ score, grade }); };
      }
      $('mini-body').querySelectorAll('.lanes button').forEach((b) => {
        const l = +b.dataset.l;
        b.addEventListener('touchstart', (e) => { e.preventDefault(); hit(l); }, { passive: false });
        b.addEventListener('mousedown', (e) => { e.preventDefault(); hit(l); });
      });
      $('rh-skip').onclick = () => finish(true);
      const map = { a: 0, s: 1, d: 2, j: 0, k: 1, l: 2, ArrowLeft: 0, ArrowDown: 1, ArrowRight: 2, 1: 0, 2: 1, 3: 2 };
      keyHandler = (e) => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; if (map[k] !== undefined) { e.preventDefault(); hit(map[k]); } };
      setTimeout(() => { if (done) return; start = performance.now(); raf = requestAnimationFrame(frame); }, 400);
    });
  };

  // ---------- Timing bar (cooking, gym, latte art, moving furniture) ----------
  MG.timing = function (opt) {
    opt = opt || {};
    return new Promise((resolve) => {
      const rounds = opt.rounds || 3, labels = opt.labels || [];
      let r = 0, pos = 0, dir = 1, raf = 0, last = null, scores = [], zone = null, lock = false;
      const zw = U.clamp(opt.zone || 0.16, 0.08, 0.32);
      function newZone() { const c = 0.2 + Math.random() * 0.6; zone = { a: c - zw / 2, b: c + zw / 2, pa: c - zw / 6, pb: c + zw / 6 }; }
      function render() {
        open(`<div class="mg-head"><h3>⏱️ ${U.esc(opt.title || '看準時機')}</h3><span class="muted">${r + 1}／${rounds}</span></div>
          <div class="mg-step">${U.esc(labels[r] || '')}・指針停在<b>綠色區域</b>內（黃色更好）</div>
          <div class="timing" id="tm-bar"><div class="zone" style="left:${zone.a * 100}%;width:${(zone.b - zone.a) * 100}%"></div><div class="zone perfect" style="left:${zone.pa * 100}%;width:${(zone.pb - zone.pa) * 100}%"></div><div class="needle" id="tm-n"></div></div>
          <button class="big-btn" id="tm-go">${U.esc(opt.verb || '就是現在！')}</button>
          <div class="mg-foot"><span class="muted" id="tm-res">${scores.length ? '上一回：' + ['失手', '不錯', '完美'][scores[scores.length - 1] === 100 ? 2 : scores[scores.length - 1] === 70 ? 1 : 0] : '按按鈕、空白鍵或 E'}</span><span></span></div>`);
        const go = $('tm-go');
        go.addEventListener('touchstart', (e) => { e.preventDefault(); stop(); }, { passive: false });
        go.addEventListener('mousedown', (e) => { e.preventDefault(); stop(); });
      }
      function loop(ts) {
        if (last === null) last = ts;
        const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
        const sp = 0.85 + r * 0.22;
        pos += dir * sp * dt; if (pos > 1) { pos = 1; dir = -1; } if (pos < 0) { pos = 0; dir = 1; }
        const n = $('tm-n'); if (n) n.style.left = (pos * 100) + '%';
        raf = requestAnimationFrame(loop);
      }
      function stop() {
        if (lock) return; lock = true;
        const s = pos >= zone.pa && pos <= zone.pb ? 100 : pos >= zone.a && pos <= zone.b ? 70 : 20;
        scores.push(s);
        const bar = $('tm-bar'); if (bar) bar.style.boxShadow = `inset 0 0 0 3px ${s === 100 ? '#f2b33d' : s === 70 ? '#2f8f83' : '#d4553f'}`;
        setTimeout(() => {
          r++; lock = false;
          if (r >= rounds) { cancelAnimationFrame(raf); const score = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length); close(); resolve({ score }); return; }
          newZone(); render();
        }, 420);
      }
      keyHandler = (e) => { if (e.key === ' ' || e.key === 'Enter' || e.key === 'e' || e.key === 'E') { e.preventDefault(); stop(); } };
      newZone(); render(); raf = requestAnimationFrame(loop);
    });
  };
})(window.SW);

// ---- js/director.js
'use strict';
(function (SW) {
  const U = SW.U, T = SW.T, UI = SW.UI, Sys = SW.Sys;
  // Narrative Director: picks conditional storylets from world time, place, cast presence, memories and flags.
  const Dir = SW.Dir = { list: [], byId: {} };
  let running = false;

  Dir.add = function (st) {
    st.kind = st.kind || 'scene';
    st.prio = st.prio || 0;
    if (st.once === undefined) st.once = true;
    Dir.list.push(st); Dir.byId[st.id] = st;
    Dir.list.sort((a, b) => b.prio - a.prio);
  };

  Dir.eligible = function (st, ignorePlace) {
    const S = SW.S;
    if (st.once && S.fired[st.id] !== undefined) return false;
    if (st.cooldown && S.fired[st.id] !== undefined && S.t - S.fired[st.id] < st.cooldown) return false;
    if (st.day !== undefined && ![].concat(st.day).includes(T.day())) return false;
    if (st.dow !== undefined && ![].concat(st.dow).includes(T.dow())) return false;
    if (st.from && T.mod() < U.hm(st.from)) return false;
    if (st.to && T.mod() >= U.hm(st.to)) return false;
    if (!ignorePlace) {
      if (st.where && ![].concat(st.where).includes(S.p.map)) return false;
      if (st.cast) for (const c of st.cast) if (!SW.W.present(c)) return false;
    }
    if (st.cond) { try { if (!st.cond(S)) return false; } catch (e) { console.error('cond', st.id, e); return false; } }
    return true;
  };

  Dir.fire = function (st) { const S = SW.S; S.fired[st.id] = S.t; S.fc[st.id] = (S.fc[st.id] || 0) + 1; };

  Dir.tick = function (opts) {
    const S = SW.S; if (!S || S.over) return;
    opts = opts || {};
    for (const st of Dir.list) {
      if (st.kind !== 'offscreen' && st.kind !== 'phone') continue;
      if (!Dir.eligible(st, true)) continue;
      Dir.fire(st);
      try { st.run(S); } catch (e) { console.error('offscreen', st.id, e); }
    }
    if (opts.offscreenOnly || running || UI.busy()) return;
    // NPCs walking over to talk
    for (const id of Object.keys(S.n)) {
      const n = S.n[id]; if (!n.approach) continue;
      const st = Dir.byId[n.approach];
      if (!st || n.map !== S.p.map || !Dir.eligible(st, true)) { delete n.approach; continue; }
      if (SW.W.distTo(id) < 1.7) { Dir.run(st); return; }
    }
    for (const st of Dir.list) {
      if (st.kind === 'scene' && Dir.eligible(st)) { Dir.run(st); return; }
    }
    if (Object.keys(S.n).some((id) => S.n[id].approach)) return;
    for (const st of Dir.list) {
      if (st.kind !== 'approach') continue;
      if (!SW.W.present(st.npc)) continue;
      if (!Dir.eligible(st, true)) continue;
      if (st.where && ![].concat(st.where).includes(S.p.map)) continue;
      if (S.p.follower === st.npc) { Dir.run(st); return; }
      S.n[st.npc].approach = st.id;
      return;
    }
  };

  Dir.run = async function (st) {
    if (running) return;
    running = true;
    const S = SW.S;
    for (const id of Object.keys(S.n)) if (S.n[id].approach === st.id) delete S.n[id].approach;
    Dir.fire(st);
    try { await SW.scene(async () => { await st.run(S); }); }
    finally { running = false; }
    setTimeout(() => Dir.tick(), 30);
  };
  Dir.runById = function (id) {
    const st = Dir.byId[id]; if (!st) return;
    if (st.can && !st.can(SW.S)) { if (st.cannot) UI.toast(st.cannot(SW.S)); return; }
    return Dir.run(st);
  };

  Dir.talkFor = function (npc) {
    for (const st of Dir.list) if (st.kind === 'talk' && st.npc === npc && Dir.eligible(st, !st.where)) return st;
    return null;
  };
  Dir.hasTalk = function (npc) { const st = Dir.talkFor(npc); return !!st && st.hint !== false; };

  Dir.onEnter = function (mapId) {
    const S = SW.S;
    S.f['v_' + mapId + '_' + T.day()] = true;
    const pj = S.f.pendingJoint;
    if (pj && S.p.follower === pj.id && SW.ACTS[pj.act].map === mapId) { setTimeout(() => SW.Acts.joint(pj.id, pj.act, { romantic: pj.romantic }), 250); return; }
    if (S.p.follower && SW.Acts.placeActs().length && !pj) UI.toast(`✨ 點${SW.name(S.p.follower)} →「一起做點什麼」`);
    setTimeout(() => Dir.tick(), 60);
    SW.save();
  };

  Dir.hints = function () {
    const out = [];
    for (const h of SW.HINTS || []) {
      if (h.day !== undefined && ![].concat(h.day).includes(T.day())) continue;
      if (h.from && T.mod() < U.hm(h.from)) continue;
      if (h.to && T.mod() >= U.hm(h.to)) continue;
      if (h.cond && !h.cond(SW.S)) continue;
      out.push(typeof h.text === 'function' ? h.text(SW.S) : h.text);
    }
    return out.slice(0, 2);
  };

  Dir.episodeCard = async function () {
    const S = SW.S, d = T.day();
    if (S.seenCards[d]) return;

  IN.init = function () {
    window.addEventListener('keydown', (e) => {

        const n = parseInt(k, 10);
        if (n >= 1 && n <= 9 && UI._choiceRes) { e.preventDefault(); UI._choiceRes(n - 1); return; }
        if (k === 'Enter' || k === ' ' || k === 'e' || k === 'E') { e.preventDefault(); UI.dialogTap(); }
        return;
      }
      if (!$('sheet').hidden) {
        if (k === 'Escape') UI.closeSheet(true);
        const n = parseInt(k, 10); if (n >= 1 && n <= 9) { const b = $('sheet-items').querySelectorAll('.sitem:not([disabled])')[n - 1]; if (b) b.click(); }
        return;
      }
      if (!$('phone').hidden) { if (k === 'Escape' || k === 'p' || k === 'P') SW.Phone.close(); return; }
      if (!$('title').hidden || UI.busy()) return;
      IN.keys[k.toLowerCase()] = true;
      if (k === 'e' || k === 'E' || k === 'Enter' || k === ' ') { e.preventDefault(); SW.Sys.interact(W.target); }
      if (k === 'p' || k === 'P' || k === 'Tab') { e.preventDefault(); SW.Phone.open(); }
      if (k.startsWith('Arrow')) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => { IN.keys[e.key.toLowerCase()] = false; });
    window.addEventListener('blur', () => { IN.keys = {}; });

    const cv = $('game');
    let down = null;
    cv.addEventListener('pointerdown', (e) => {
      if (dialogOpen()) { UI.dialogTap(); return; }
      if (UI.busy()) return;
      cv.setPointerCapture(e.pointerId);
      down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId, joy: false };
    });
    cv.addEventListener('pointermove', (e) => {
      if (!down || e.pointerId !== down.id) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y, d = Math.hypot(dx, dy);
      if (!down.joy && d > 14) {
        down.joy = true; W.autoPath = null; W.marker = null;
        const st = $('stick'); st.style.left = down.x + 'px'; st.style.top = down.y + 'px'; st.hidden = false;
      }
      if (down.joy) {
        const m = Math.min(d, 50), ang = Math.atan2(dy, dx);
        IN.vec.x = Math.cos(ang) * m / 50; IN.vec.y = Math.sin(ang) * m / 50;
        $('stick-knob').style.transform = `translate(${Math.cos(ang) * m}px, ${Math.sin(ang) * m}px)`;
      }
    });
    const end = (e) => {
      if (!down || e.pointerId !== down.id) return;
      const wasJoy = down.joy, short = performance.now() - down.t < 450;
      const pt = { x: down.x, y: down.y };
      down = null; IN.vec.x = 0; IN.vec.y = 0; $('stick').hidden = true; $('stick-knob').style.transform = '';
      if (!wasJoy && short && !UI.busy()) tapAt(pt.x, pt.y);
    };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);

    $('dialog').addEventListener('click', (e) => { if (e.target.closest('#dlg-choices button')) return; UI.dialogTap(); });
    $('btn-act').addEventListener('click', () => SW.Sys.interact(W.target));
    $('btn-phone').addEventListener('click', () => { if (!UI.busy()) SW.Phone.open(); });
    $('phone-close').addEventListener('click', () => SW.Phone.close());
    $('phone-back').addEventListener('click', () => { if (SW.Phone.back) SW.Phone.back(); });
    $('sheet-close').addEventListener('click', () => UI.closeSheet(true));
    $('sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') UI.closeSheet(true); });
    $('phone').addEventListener('click', (e) => { if (e.target.id === 'phone') SW.Phone.close(); });
    $('objective').addEventListener('click', () => UI.toggleObjective());
  };

  function tapAt(sx, sy) {
    const p = SW.S.p, w = W.screenToWorld(sx, sy);
    const hit = W.pick(w.x, w.y);
    if (hit) {
      const tx = hit.type === 'npc' ? SW.S.n[hit.id].x : hit.obj.x + hit.obj.w / 2, ty = hit.type === 'npc' ? SW.S.n[hit.id].y : hit.obj.y + hit.obj.h;
      if (Math.hypot(tx - p.x, ty - p.y) < 1.7) { SW.Sys.interact(hit); return; }
      const goal = hit.type === 'npc' ? [Math.floor(tx), Math.floor(ty)] : [Math.floor(hit.obj.x + hit.obj.w / 2), hit.obj.y + hit.obj.h];
      W.walkTo(goal[0], goal[1], () => {
        const n = W.nearest();
        if (n && ((n.type === 'npc' && hit.type === 'npc' && n.id === hit.id) || (n.type === 'obj' && hit.type === 'obj' && n.obj.id === hit.obj.id))) SW.Sys.interact(n);
        else SW.Sys.interact(hit.type === 'npc' && W.present(hit.id) && W.distTo(hit.id) < 2.2 ? hit : n);
      });
      return;
    }
    W.walkTo(Math.floor(w.x), Math.floor(w.y));
  }

  IN.moveVec = function () {
    const k = IN.keys;
    let x = IN.vec.x, y = IN.vec.y;
    if (k.a || k.arrowleft) x -= 1; if (k.d || k.arrowright) x += 1;
    if (k.w || k.arrowup) y -= 1; if (k.s || k.arrowdown) y += 1;
    return { x, y };
  };
})(window.SW);

// ---- js/main.js
'use strict';
(function (SW) {
  const U = SW.U, T = SW.T, UI = SW.UI, W = SW.W, Sys = SW.Sys;
  const $ = (id) => document.getElementById(id);
  const Main = SW.Main = {};
  SW.timeScale = 1;
  try { SW.fastText = localStorage.getItem('sw-fast') === '1'; } catch (e) { SW.fastText = false; }

  const HAIR = ['#1d1c24', '#4a2f22', '#7a3b22', '#c9a063', '#c94f86', '#3f5f8f', '#e8e3d8'];
  const SKIN = ['#f6d6bd', '#efc6a0', '#e2b48c', '#c99266', '#9a6a46'];
  const OUTFIT = ['#f2b33d', '#2f8f83', '#e46b7b', '#4a6fa5', '#3d3d48', '#f4f7f3', '#8a6bb8'];
  const STYLES = [['bob', '鮑伯頭'], ['long', '長髮'], ['short', '短髮'], ['pony', '馬尾'], ['spiky', '刺蝟頭'], ['neat', '旁分']];

  function lookEditor(look, onChange) {
    const sw = (arr, key) => `<div class="swatches">${arr.map((c) => `<button data-k="${key}" data-v="${c}" class="${look[key] === c ? 'on' : ''}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div>`;
    const html = `<div style="display:flex;justify-content:center"><canvas id="avatar-prev" width="192" height="192"></canvas></div>
      <div><label class="lab">髮型</label><div class="chips">${STYLES.map(([v, l]) => `<button data-k="style" data-v="${v}" class="${look.style === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>
      <div><label class="lab">髮色</label>${sw(HAIR, 'hair')}</div>
      <div><label class="lab">膚色</label>${sw(SKIN, 'skin')}</div>
      <div><label class="lab">衣服</label>${sw(OUTFIT, 'outfit')}</div>
      <div><label class="lab">配件</label><div class="chips">${[['none', '無'], ['glasses', '眼鏡'], ['cap', '帽子'], ['cardigan', '針織外套']].map(([v, l]) => `<button data-k="acc" data-v="${v}" class="${look.acc === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>`;
    return {
      html,
      bind(root) {
        const draw = () => { const c = root.querySelector('#avatar-prev'); const g = c.getContext('2d'); g.clearRect(0, 0, 192, 192); W.drawChar(g, 96, 112, 150, look, {}); };
        root.querySelectorAll('[data-k]').forEach((b) => {
          b.onclick = () => { look[b.dataset.k] = b.dataset.v; root.querySelectorAll(`[data-k="${b.dataset.k}"]`).forEach((x) => x.classList.toggle('on', x === b)); draw(); if (onChange) onChange(); };
        });
        draw();
      },
    };
  }

  Main.title = function () {
    const save = SW.loadSave();
    const el = $('title');
    el.hidden = false;
    el.innerHTML = `<div class="t-wrap">
      <h1 class="t-logo">Shannon's <span>World</span></h1>
      <div class="t-sub">新竹人生模擬器・第一季《我們還有地方可以坐嗎？》</div>
      <p class="t-tag">不要只是生活在世界裡。<br>讓整個世界記得你曾經怎麼生活。</p>
      <div class="t-btns">
        ${save ? `<button class="btn primary" id="t-cont">繼續：${U.esc(save.p.name)}・${T.DAYS[(Math.floor(save.t / 1440)) % 7]} ${U.fmt(save.t % 1440)}</button>` : ''}
        <button class="btn ${save ? 'alt' : 'primary'}" id="t-new">${save ? '開始新的人生（會覆蓋存檔）' : '開始新的人生'}</button>
      </div>
      <p class="t-note">支援電腦與手機瀏覽器。電腦用 WASD／方向鍵移動、E 互動、P 打開手機；手機拖曳畫面移動、點擊互動。遊戲會自動存在這個瀏覽器裡。<br>所有公司、人物與事件皆為虛構。</p>
    </div>`;
    if (save) $('t-cont').onclick = () => Main.start(save);
    $('t-new').onclick = () => Main.create();
  };

  Main.create = function () {
    const look = { hair: '#1d1c24', style: 'long', skin: '#f6d6bd', outfit: '#f2b33d', acc: 'none' };
    const opt = { name: 'Shannon', pron: '她', bg: 'engineer', housing: 'solo', look };
    const el = $('title');
    const ed = lookEditor(look);
    const bgs = Object.entries(SW.BACKGROUNDS);
    el.innerHTML = `<div class="t-wrap"><h2 class="t-logo" style="font-size:34px;margin-top:2vh">你是誰？</h2>
      <div class="form">
        <div><label class="lab" for="f-name">名字</label><input type="text" id="f-name" maxlength="10" value="Shannon" autocomplete="off"></div>
        <div><label class="lab">別人提到你時用</label><div class="chips" id="f-pron">${['她', '他', 'TA'].map((p) => `<button data-v="${p}" class="${p === opt.pron ? 'on' : ''}">${p}</button>`).join('')}</div></div>
        <div id="f-look">${ed.html}</div>
        <div><label class="lab">背景</label><p class="muted" style="margin:0 0 6px">25 歲，SSD 韌體工程師，進公司一年。你比較像……</p><div class="opt-cards" id="f-bg">${bgs.map(([k, b]) => `<button data-v="${k}" class="${k === opt.bg ? 'on' : ''}"><b>${b.name}</b><span>${b.desc}</span></button>`).join('')}</div></div>
        <div><label class="lab">住哪裡？</label><div class="opt-cards" id="f-house">
          <button data-v="solo" class="on"><b>獨居套房</b><span>私人空間多。安靜，有時候太安靜。</span></button>
          <button data-v="shared"><b>和米拉合租</b><span>每天都有室友事件。冰箱會分區，會吵架，也會一起看劇。</span></button>
        </div></div>
        <button class="btn" id="f-go" style="font-size:17px;min-height:54px;text-align:center">星期一 08:45，起床</button>
        <button class="ghost" id="f-back">返回</button>
      </div></div>`;
    ed.bind($('f-look'));
    const grp = (id, key) => $(id).querySelectorAll('button').forEach((b) => { b.onclick = () => { opt[key] = b.dataset.v; $(id).querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); }; });
    grp('f-pron', 'pron'); grp('f-bg', 'bg'); grp('f-house', 'housing');
    $('f-back').onclick = () => Main.title();
    $('f-go').onclick = () => {
      opt.name = ($('f-name').value || 'Shannon').trim().slice(0, 10) || 'Shannon';
      const S = SW.newState(opt);
      Main.start(S, true);
    };
  };

  Main.editLook = async function () {
    const look = SW.S.p.look;
    const ed = lookEditor(look);
    const p = UI.card({ kicker: '衣櫃', title: '換個造型', html: `<div class="form" style="padding:0">${ed.html}</div>`, buttons: [{ t: '完成', v: 1 }] });
    ed.bind($('card-body'));
    await p;
    SW.S.f.newLook = T.day();
  };

  Main.start = function (S, fresh) {
    SW.S = S;
    W.reset();
    $('title').hidden = true; $('hud').hidden = false;
    if (fresh) {
      const [x, y] = W.spot('home', 'bed');
      S.p.map = 'home'; S.p.x = x + 0.5; S.p.y = y + 0.5; S.p.dir = 'down';
    }
    W.updateNPCs(0, true);
    W.resize($('game'));
    SW.save(true);
    if (!Main.loopOn) { Main.loopOn = true; requestAnimationFrame(loop); }
    setTimeout(async () => { await SW.Dir.episodeCard(); SW.Dir.tick(); }, 200);
  };

  let last = 0, dirT = 0, exT = 0;
  function loop(ts) {
    const dt = Math.min(0.1, last ? (ts - last) / 1000 : 0.016); last = ts;
    const S = SW.S;
    if (S && $('title').hidden) {
      W.anim += dt;
      const busy = UI.busy();
      if (!busy && !document.hidden) {
        const gm = dt * SW.timeScale; // 1 real second = 1 game minute
        const before = T.day();
        S.t += gm;
        if (T.day() !== before) Sys.dayStart();
        Sys.tick(gm, false);
        if (!W.followPath(dt)) { const v = SW.IN.moveVec(); if (v.x || v.y) { W.autoPath = null; W.marker = null; } W.movePlayer(v.x, v.y, dt); }
        dirT -= dt; if (dirT <= 0) { dirT = 0.5; SW.Dir.tick(); }
        exT -= dt; if (exT <= 0) { exT = 2; Sys.checkExhaust(); }
      } else {
        S.p.moving = false;
        W.updateNPCs(0, false);
      }
      W.target = busy ? null : W.nearest();
      W.render($('game').getContext('2d'));
      UI.hud(dt);
    }
    requestAnimationFrame(loop);
  }

  // Debug helpers for playtesting from the browser console (SW.debug.skip(3,'19:00') etc.)
  SW.debug = {
    skip: async (day, hm) => { const target = T.at(day, hm); if (target > SW.S.t) await Sys.advance(target - SW.S.t, false); W.updateNPCs(0, true); SW.Dir.tick(); },
    go: (map) => W.travelTo(map),
    money: (n) => Sys.money(n),
    state: () => SW.S,
    where: () => Object.fromEntries(Object.keys(SW.S.n).map((id) => [id, `${SW.S.n[id].map} ${SW.S.n[id].act}`])),
  };

  window.addEventListener('resize', () => { W.resize($('game')); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) SW.save(); });
  window.addEventListener('pagehide', () => SW.save());

  window.addEventListener('DOMContentLoaded', () => {
    SW.IN.init();
    W.resize($('game'));
    Main.title();
  });
})(window.SW);

</script>
